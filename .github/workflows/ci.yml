name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Deliberately ubuntu, not macOS: none of this app's logic or tests are
    # macOS-specific (see tests/unit and tests/e2e — audio-source resolution
    # and the guidance engine are asserted to behave correctly on whichever
    # platform they run on), and GitHub-hosted macOS runners cost 10x against
    # Actions minutes on a private repo. Not worth it for a PR gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build app and tests
        run: npm run build && npm run build:tests

      - name: Unit tests
        run: npm run test:unit

      # Electron needs a real (even if virtual) display server to start at
      # all, regardless of whether a window is ever shown.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # npm installs Electron as the unprivileged runner user, so its
      # Chromium sandbox helper binary never gets the root-owned setuid bit
      # it needs — Electron aborts on launch rather than silently running
      # unsandboxed: "chrome-sandbox is owned by root and has mode 4755".
      # This is the standard fix (keeps the real sandbox enabled in CI,
      # rather than disabling it via ELECTRON_DISABLE_SANDBOX) — a real
      # failure hit on this workflow's first real run, not anticipated in
      # advance.
      - name: Fix Electron sandbox permissions
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Integration tests
        run: xvfb-run --auto-servernum npm run test:integration

      - name: E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
